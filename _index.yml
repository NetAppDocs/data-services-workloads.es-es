indexpage:
  title: Documentación de NetApp Workload Factory
  summary: Empieza a usar NetApp Workload Factory para sacar el máximo partido a tus
    cargas de trabajo de almacenamiento en la nube. Una vez que se complete la configuración,
    podrás crear, optimizar y gestionar tus sistemas de almacenamiento para tus cargas
    de trabajo, explorar el ahorro de costes, usar el co-pilot integrado de Infrastructure-as-Code
    para la automatización en todas las plataformas y gestionar tus cargas de trabajo
    en Workload Factory.
  keywords: Workload Factory, fsx, account, credentials, users, permissions, log in,
    calculator, codebox
  lead: Empieza a usar NetApp Workload Factory para sacar el máximo partido a tus
    cargas de trabajo cuando uses Amazon FSx for NetApp ONTAP y OCI NetApp Storage
    Service. Una vez completada la configuración, podrás crear, optimizar y gestionar
    sistemas de archivos de FSx for ONTAP para tus cargas de trabajo, explorar el
    ahorro de costes con FSx for ONTAP, usar el copiloto integrado de Infrastructure-as-Code
    para la automatización en todas las plataformas y gestionar tus cargas de trabajo
    en Workload Factory.
